# Fork-only: rebuild main from heytcass/home-assistant-addons every day.
#
# Each run takes upstream's files (everything outside .github/), applies
# .github/fork/apply.sh on top, and commits the result if it differs. No
# upstream history is merged, so there are no merge conflicts, and
# upstream's workflow files never land here (pushing those would need a
# PAT with the workflows permission). A run that fails verification
# pushes nothing, leaving the last good main in place.
name: Sync upstream

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths: [".github/fork/**", ".github/workflows/sync-upstream.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Take upstream's files
        id: upstream
        run: |
          git fetch --no-tags https://github.com/heytcass/home-assistant-addons.git main
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          git ls-files -z -- . ':!:.github' | xargs -0 -r git rm -q --
          git checkout FETCH_HEAD -- . ':!:.github'

      - name: Apply fork overlay
        run: .github/fork/apply.sh && .github/fork/verify.sh

      - name: Commit and push
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "main already matches upstream ${UPSTREAM_SHA::7} + overlay"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Sync upstream heytcass/home-assistant-addons@${UPSTREAM_SHA::7}" \
            -m "Upstream-Commit: $UPSTREAM_SHA"
          git show --stat --format='%s' HEAD
          git push origin HEAD:main

      # GitHub disables scheduled workflows in repos with no activity for
      # 60 days, which would happen whenever upstream goes quiet. Re-enabling
      # it through the API is reported to reset that timer (the approach
      # gautamkrishnar/keepalive-workflow uses); if it stops working, the
      # schedule shows as disabled in the Actions tab and one click fixes it.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/sync-upstream.yml/enable"
